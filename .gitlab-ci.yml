# 兼容当前旧版 GitLab，使用 only/except，不使用 rules/needs。
image: node:24-bookworm

variables:
  # Runner 11 将 0 传为 --depth 0；发布来源检查按需 unshallow。
  GIT_DEPTH: "50"

stages:
  - verify
  - browser
  - publish

cache:
  key: daisu-ui-npm
  paths:
    - .npm/

before_script:
  - node scripts/check-release-source.mjs
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verify:
  stage: verify
  script:
    - npm test
    - npm run test:git-release
    - npm run test:npm-release
    - npm run test:types
    - npm run build
    - npm run ui:check
    - npm run ui:pack
    - node scripts/prepare-npm-package.mjs
    - node scripts/prepare-git-package.mjs
    - npm run test:docs:release
    - node scripts/docs-release.mjs pack --id "$CI_COMMIT_SHA" --commit "$CI_COMMIT_SHA"
  only:
    - branches
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  except:
    - npm-dist
    - /^npm-v/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts/*.tgz
      - artifacts/git-package/
      - artifacts/npm-release.json
      - artifacts/docs-site/

# Package automatic publishing is disabled on GitLab.

# Documentation uses the verified static artifact; no deployment credentials are
# required for browser checks or downloading a branch preview.
docs:browser:
  stage: browser
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  dependencies:
    - verify
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  variables:
    DAISU_DOCS_ROOT: artifacts/docs-site
  script:
    - node scripts/docs-release.mjs verify
    - npm run test:docs:browser
  only:
    - branches
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  except:
    - npm-dist
    - /^npm-v/
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/docs-browser-report/
      - artifacts/docs-browser-results/

docs:preview:
  stage: publish
  before_script: []
  dependencies:
    - verify
  script:
    - bash ops/deploy-docs.sh "previews/$CI_COMMIT_REF_SLUG"
  when: manual
  allow_failure: true
  only:
    - developer

docs:production:
  stage: publish
  before_script: []
  dependencies:
    - verify
  script:
    - bash ops/deploy-docs.sh production
  when: manual
  allow_failure: true
  only:
    - main

docs:rollback:
  stage: publish
  before_script: []
  dependencies: []
  script:
    - bash ops/deploy-docs.sh production rollback
  when: manual
  allow_failure: true
  only:
    - main
