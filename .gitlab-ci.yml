# 兼容当前旧版 GitLab，使用 only/except，不使用 rules/needs。
image: node:24-bookworm

stages:
  - verify
  - publish

cache:
  key: daisu-ui-npm
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verify:
  stage: verify
  script:
    - npm test
    - npm run test:git-release
    - npm run test:types
    - npm run build
    - npm run ui:check
    - npm run ui:pack
    - node scripts/prepare-git-package.mjs
  only:
    - branches
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  except:
    - npm-dist
    - /^npm-v/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts/*.tgz
      - artifacts/git-package/

publish:git:
  stage: publish
  before_script: []
  dependencies:
    - verify
  script:
    - node scripts/publish-git-package.mjs
  only:
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
