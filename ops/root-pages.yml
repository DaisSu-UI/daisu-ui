name: Publish Daisu UI homepage

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: organization-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://daissu-ui.github.io/
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DaisSu-UI/daisu-ui
          ref: main
          path: ui-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull the verified project site
        id: site
        run: node ui-source/scripts/pull-project-site.mjs --current https://daissu-ui.github.io/ --output site
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.site.outputs.changed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.site.outputs.changed == 'true'
