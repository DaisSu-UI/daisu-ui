name: Documentation

on:
  push:
    branches: [developer, main]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:
    inputs:
      channel:
        description: Download artifacts, publish Pages, deploy preview/production, or rollback production
        type: choice
        options: [artifacts, pages, preview, production, rollback]
        default: artifacts
      rollback_release:
        description: Existing verified release ID (rollback only)
        type: string

permissions:
  contents: read

env:
  DAISU_UI_AUTO_SYNC: "0"

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:types
      - run: npm run test:docs:release
      - run: npm run build
      - name: Check the independent starter
        run: |
          npm ci --prefix examples/quickstart --no-audit --no-fund
          npm run typecheck --prefix examples/quickstart
          npm run build --prefix examples/quickstart
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs:browser
      - name: Check the GitHub Pages subdirectory
        run: npm run test:docs:browser
        env:
          DAISU_DOCS_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Package verified static site
        run: node scripts/docs-release.mjs pack --id "$GITHUB_SHA" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site-${{ github.sha }}
          path: artifacts/docs-site/
          retention-days: 30
      - name: Upload GitHub Pages site
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.channel == 'pages'))
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs-site/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-report
          path: |
            artifacts/docs-browser-report/
            artifacts/docs-browser-results/
          retention-days: 7

  flutter-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          cache: true
      - working-directory: examples/flutter-host
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  pages:
    name: Publish GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'pages'))
    needs: [site, flutter-template]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["preview", "production", "rollback"]'), inputs.channel)
    needs: [site, flutter-template]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'preview' && 'docs-preview' || 'docs-production' }}
    concurrency:
      group: docs-site-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate production source
        env:
          DOCS_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$DOCS_CHANNEL" != preview ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production deployment and rollback require main.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-${{ github.sha }}
          path: artifacts/docs-site/
      - name: Configure deployment identity
        env:
          DOCS_SSH_PRIVATE_KEY: ${{ secrets.DOCS_SSH_PRIVATE_KEY }}
          DOCS_SSH_KNOWN_HOSTS: ${{ secrets.DOCS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DOCS_SSH_PRIVATE_KEY"
          test -n "$DOCS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DOCS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DOCS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Activate verified site or rollback
        env:
          DOCS_CHANNEL: ${{ inputs.channel }}
          DOCS_SSH_TARGET: ${{ secrets.DOCS_SSH_TARGET }}
          DOCS_DEPLOY_ROOT: ${{ vars.DOCS_DEPLOY_ROOT }}
          DOCS_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
        run: |
          case "$DOCS_CHANNEL" in
            preview)
              docs_preview_slug=$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | cut -c 1-70)
              docs_preview_hash=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c 1-10)
              bash ops/deploy-docs.sh "previews/branch-$docs_preview_slug-$docs_preview_hash"
              ;;
            production) bash ops/deploy-docs.sh production ;;
            rollback) bash ops/deploy-docs.sh production rollback ;;
          esac
