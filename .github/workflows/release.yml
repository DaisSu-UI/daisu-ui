name: Publish UI to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ui-npm-release
  cancel-in-progress: false

env:
  DAISU_UI_AUTO_SYNC: '0'

jobs:
  publish:
    name: Verify a version tag and publish @daisu-ui/ui
    runs-on: ubuntu-latest
    if: github.repository == 'DaisSu-UI/daisu-ui' && github.ref_type == 'tag'
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version and accepted source
        run: node scripts/check-release-source.mjs --require-main
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate release scripts
        run: node --test scripts/release-environment.test.mjs scripts/npm-release.test.mjs scripts/git-release.test.mjs
      - name: Run component tests
        run: npm test
      - name: Check types
        run: npm run test:types
      - name: Build documentation and demos
        run: npm run build
      - name: Validate the standalone package
        run: npm run ui:check
      - name: Pack the UI package
        run: npm run ui:pack
      - name: Prepare the verified npm archive
        run: node scripts/prepare-npm-package.mjs
      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-npm-package
          path: |
            artifacts/*.tgz
            artifacts/npm-release.json
          retention-days: 7
      - name: Publish the verified archive to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-package.mjs
