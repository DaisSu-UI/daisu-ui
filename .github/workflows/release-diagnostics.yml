name: Inspect npm publication result

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the beta.5 publication run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/DaisSu-UI/daisu-ui/actions/jobs/139700009008/logs > "$RUNNER_TEMP/npm-publication.log"
      - name: Report publication mode and registry response
        run: |
          python3 - <<'PY'
          import os
          import io
          import zipfile
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP'], 'npm-publication.log').read_bytes()
          if data.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  text = '\n'.join(archive.read(name).decode(errors='replace') for name in archive.namelist() if not name.endswith('/'))
          else:
              text = data.decode(errors='replace')
          markers = ['publish-npm-package.mjs', '发布 UI 库', '预演 UI 库', 'Publishing to', '+ @daisu-ui/ui', 'npm error', 'npm warn', 'dry-run', 'review', 'holding']
          lines = [line for line in text.splitlines() if any(marker in line for marker in markers)]
          report = f'Inspected {len(data)} bytes of job logs.\n' + ('\n'.join(lines[-60:]) or 'No npm publication marker was recorded by the publishing step.')
          print(report)
          annotation = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=npm publication receipt::' + annotation)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## npm publication receipt\n\n```text\n' + report + '\n```\n')
          PY
